name: Pesquisa diária de licitações

on:
  schedule:
    # 07:00 no horário de Brasília (UTC-3), todos os dias.
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  buscar-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar PNCP no Render
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL}" ]; then
            echo "O secret RENDER_URL não está configurado."
            exit 1
          fi

          DATA_ANTERIOR="$(date -u -d 'yesterday' +%F)"
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          curl --fail-with-body --silent --show-error --location \
            --request POST "${RENDER_URL%/}/api/buscar" \
            "${AUTH_HEADER[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"escopo\":\"estado\",\"uf\":\"GO\",\"dataInicial\":\"${DATA_ANTERIOR}\",\"dataFinal\":\"${DATA_ANTERIOR}\"}"
